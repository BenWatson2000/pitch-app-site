<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* The app's own ramp. Warm greys and exactly one red. */
:root {
  --paper:    #F3F2F2;
  --ink:      #201E1D;
  --quiet:    #7D7979;
  --hairline: #D8D5D5;
  --accent:   #EC3013;
  --measure:  34rem;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
  font-size: 17px;
  line-height: 1.6;
}

/* The ground, behind everything, as faint as the app draws it small. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("{{ '/assets/contours-page.png' | relative_url }}") center / cover no-repeat;
  opacity: .30;
  pointer-events: none;
  z-index: 0;
}
.wrap { position: relative; z-index: 1; }

/* Masthead: contours, the wordmark, one red rule. */
.hero {
  background: url("{{ '/assets/contours-hero.png' | relative_url }}") center / cover no-repeat;
  border-bottom: 1px solid var(--hairline);
  padding: clamp(3.5rem, 12vw, 7rem) 1.5rem clamp(2rem, 6vw, 3rem);
}
.hero-inner { max-width: var(--measure); margin: 0 auto; }
.wordmark {
  font-weight: 900;
  font-size: clamp(3.75rem, 17vw, 8.5rem);
  line-height: .84;
  letter-spacing: .01em;
  margin: 0;
}
.wordmark .dot { color: var(--accent); }
.rule { width: 4.5rem; height: 6px; background: var(--accent); margin: 1.4rem 0 1.1rem; }
.strap {
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .13em;
  font-size: clamp(.8rem, 2.9vw, 1rem);
  margin: 0;
}
.strap-sub {
  color: var(--quiet);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  font-size: clamp(.68rem, 2.4vw, .82rem);
  margin: .5rem 0 0;
}

main { max-width: var(--measure); margin: 0 auto; padding: clamp(2.5rem, 8vw, 4rem) 1.5rem 5rem; }
/* The hero carries the app's name, so a page heading here is the *page's*
   name — "Privacy policy" — and must not be hidden with it. */
main h1 {
  font-weight: 900;
  font-size: clamp(1.9rem, 7vw, 2.6rem);
  line-height: 1.1;
  letter-spacing: -.02em;
  margin: 0 0 1.5rem;
}

h2 {
  font-weight: 900;
  font-size: clamp(1.5rem, 5.5vw, 2rem);
  line-height: 1.15;
  letter-spacing: -.01em;
  margin: 3rem 0 .85rem;
}
h3 {
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .11em;
  font-size: .8rem;
  color: var(--quiet);
  margin: 2.25rem 0 .6rem;
}
p, li { margin: 0 0 1rem; }
strong { font-weight: 800; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
ul { padding-left: 1.1rem; }
li::marker { color: var(--quiet); }
hr { border: 0; border-top: 1px solid var(--hairline); margin: 2.75rem 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }

/* A bare email on its own line is the one thing people come here for. */
main p > strong:only-child,
main p > a:only-child {
  display: inline-block;
  font-weight: 800;
  font-size: clamp(1.05rem, 4vw, 1.35rem);
  letter-spacing: -.01em;
  padding: .55rem 0 .15rem;
  border-bottom: 3px solid var(--accent);
}

footer {
  border-top: 1px solid var(--hairline);
  padding: 2rem 1.5rem 3rem;
  font-size: .8rem;
  color: var(--quiet);
}
footer .footer-inner { max-width: var(--measure); margin: 0 auto; }
footer a { color: var(--quiet); }
footer nav { margin-bottom: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .72rem; }
footer nav a { margin-right: 1.1rem; color: var(--ink); text-decoration: none; }
footer nav a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-inner">
      <h1 class="wordmark">PITCH<span class="dot">.</span></h1>
      <div class="rule"></div>
      <p class="strap">Wild camping, no signal needed</p>
      <p class="strap-sub">The contours of Great Britain, built in</p>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="footer-inner">
      <nav>
        <a href="{{ '/' | relative_url }}">Support</a>
        <a href="{{ '/privacy.html' | relative_url }}">Privacy</a>
      </nav>
      <p>Contains OS data © Crown copyright and database right, and Natural
      England data, under the Open Government Licence v3.0. Pitch is not
      endorsed by or affiliated with Ordnance Survey.</p>
    </div>
  </footer>
</div>
</body>
</html>
